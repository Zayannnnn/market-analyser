name: AORA Engine CI/CD Pipeline

on:
  push:
    branches:
      - master
      - docs/github-professionalization
  pull_request:
    branches:
      - master

jobs:
  backend-validation:
    name: Backend validation (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create serviceAccountKey mock file
        run: |
          echo "{}" > backend/serviceAccountKey.json

      - name: Check Backend Imports & Code Compile
        run: |
          cd backend
          python -m py_compile app/main.py

      - name: Run Backend Unit Tests
        env:
          GEMINI_API_KEY: "mock_key"
        run: |
          cd backend
          python -m unittest test_auth_notifications.py

  frontend-validation:
    name: Frontend validation (Node.js 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend React Bundle
        run: |
          cd frontend
          npm run build
